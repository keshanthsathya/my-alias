    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --cyan: #00e5ff;
      --green: #39ff14;
      --red: #ff2200;
      --text: #e8e8e8;
      --muted: #5a5a7a;
      --border: rgba(0, 229, 255, 0.2);
      --mono: "Share Tech Mono", monospace;
      --display: "Rajdhani", sans-serif;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      overflow-x: hidden;
      color: var(--text);
      background: var(--bg);
      font-family: var(--display);
    }

    button, input, textarea { font: inherit; }

    button { cursor: pointer; }

    a { color: inherit; text-decoration: none; }

    .ambient-grid,
    .scanlines {
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
    }

    .ambient-grid {
      z-index: 0;
      opacity: 0.09;
      background-image:
        linear-gradient(30deg, transparent 24%, rgba(0, 229, 255, 0.5) 25%, rgba(0, 229, 255, 0.5) 26%, transparent 27%, transparent 74%, rgba(0, 229, 255, 0.5) 75%, rgba(0, 229, 255, 0.5) 76%, transparent 77%),

      background-size: 44px 76px;
      background-position: 0 0, 0 0, 22px 38px;
      mask-image: linear-gradient(to bottom, transparent, black 12%, black 88%, transparent);
    }

    .scanlines {
      opacity: 0.12;
      background: repeating-linear-gradient(to bottom, transparent 0, transparent 3px, rgba(232, 232, 232, 0.14) 4px);
      mix-blend-mode: screen;
    }

    .page { position: relative; z-index: 1; }

    .section {

    .section-label,

    .tag,
    .stat-label,
    .stat-value,
    .project-link,
    .boot-lines,
    .boot-kicker {
      font-family: var(--mono);
    }
